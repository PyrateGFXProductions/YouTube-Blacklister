<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Blacklist Icon Generator</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; background: #0f0f0f; color: #fff; }
    canvas { border: 1px solid #333; margin: 10px; border-radius: 8px; background: #1f1f1f; }
    .container { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>YouTube Local Blacklist Icon Generator</h1>
  <p>Generating icon files for your extension...</p>
  
  <div class="container">
    <div><canvas id="c16" width="16" height="16"></canvas><br>16x16</div>
    <div><canvas id="c48" width="48" height="48"></canvas><br>48x48</div>
    <div><canvas id="c128" width="128" height="128"></canvas><br>128x128</div>
  </div>

  <script>
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      const center = size / 2;

      // Clear canvas
      ctx.clearRect(0, 0, size, size);

      // 1. Draw YouTube Red Rounded Rectangle (Base)
      const rectWidth = size * 0.75;
      const rectHeight = size * 0.52;
      const rectX = center - rectWidth / 2;
      const rectY = center - rectHeight / 2 - (size * 0.05); // Slight top offset
      const radius = size * 0.12;

      ctx.fillStyle = '#FF0000'; // YouTube Red
      ctx.beginPath();
      ctx.roundRect(rectX, rectY, rectWidth, rectHeight, radius);
      ctx.fill();

      // 2. Draw Play Button Triangle inside
      const triSize = size * 0.18;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.moveTo(center - triSize * 0.6, center - triSize - (size * 0.05));
      ctx.lineTo(center + triSize, center - (size * 0.05));
      ctx.lineTo(center - triSize * 0.6, center + triSize - (size * 0.05));
      ctx.closePath();
      ctx.fill();

      // 3. Overlay Prohibitory / Blacklist Circle-Slash Symbol
      const outerRadius = size * 0.38;
      const innerRadius = size * 0.30;
      const ringX = center + (size * 0.12); // Slightly offset to bottom-right corner for contrast
      const ringY = center + (size * 0.12);

      ctx.save();
      ctx.fillStyle = '#181818'; // Dark backdrop for symbol
      ctx.beginPath();
      ctx.arc(ringX, ringY, outerRadius + (size * 0.04), 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#CC0000'; // Darker Red / Stop Accent
      ctx.lineWidth = Math.max(1.5, size * 0.08);

      // Outer Ring
      ctx.beginPath();
      ctx.arc(ringX, ringY, outerRadius, 0, Math.PI * 2);
      ctx.stroke();

      // Diagonal Slash
      const angle = Math.PI / 4; // 45 degrees
      ctx.beginPath();
      ctx.moveTo(ringX - outerRadius * Math.cos(angle), ringY - outerRadius * Math.sin(angle));
      ctx.lineTo(ringX + outerRadius * Math.cos(angle), ringY + outerRadius * Math.sin(angle));
      ctx.stroke();
      ctx.restore();
    }

    function downloadCanvas(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = filename;
      a.click();
    }

    // Draw all three sizes
    drawIcon('c16', 16);
    drawIcon('c48', 48);
    drawIcon('c128', 128);

    // Auto-download files
    setTimeout(() => {
      downloadCanvas('c16', 'icon16.png');
      downloadCanvas('c48', 'icon48.png');
      downloadCanvas('c128', 'icon128.png');
    }, 500);
  </script>
</body>
</html>
